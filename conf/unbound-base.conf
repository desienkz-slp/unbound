server:
  # ==========================================================
  #  Unbound DNS Server Configuration (Anti-Bengong Edition)
  # ==========================================================

  # === 1. Server Interface & Access ===
  chroot: ""
  interface: {{DNS_LISTEN_IP}}
  port: {{DNS_LISTEN_PORT}}
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  
  # Access Control List (ACL)
  access-control: 127.0.0.0/8 allow
{{ACL_SUBNETS}}

  # === 2. Identitas & Privasi ===
  hide-identity: yes
  hide-version: yes
  use-syslog: no
  logfile: "/var/log/unbound/unbound.log"
  log-queries: no
  log-replies: no
  verbosity: 0

  # === 3. Anti-Bengong & Cache Tuning ===
  # Prefetch (Ambil data baru sebelum TTL habis)
  prefetch: yes
  prefetch-key: yes

  # Serve Expired (Sajikan cache lama jika upstream lambat/mati)
  serve-expired: yes
  serve-expired-ttl: 86400             # Stale data valid 1 hari (detik)
  serve-expired-client-timeout: 1800   # Jika upstream tidak jawab >1.8 detik, pakai stale
  serve-expired-reply-ttl: 30          # TTL dari balasan stale (biar client sering nanya)

  # Waktu TTL Cache
  cache-min-ttl: 30
  cache-max-ttl: 86400

  # Privasi Query (Disarankan 'no' untuk ISP resolver agar CDN non-RFC-compliant seperti Baishan/Shopee tidak NXDOMAIN)
  qname-minimisation: no

  # === 4. Resource & Performa ===
  num-threads: {{NUM_THREADS}}
  msg-cache-slabs: {{NUM_THREADS}}
  rrset-cache-slabs: {{NUM_THREADS}}
  key-cache-slabs: {{NUM_THREADS}}
  infra-cache-slabs: {{NUM_THREADS}}
  
  # Kapasitas Buffer & Queue (Jutaan RPS Tuning)
  num-queries-per-thread: 8192
  outgoing-range: 32768
  incoming-num-tcp: 4096
  jostle-timeout: 200
  
  # Socket Buffers (butuh sysctl net.core.rmem_max di-set)
  so-rcvbuf: 8m
  so-sndbuf: 8m
  so-reuseport: yes

  # Ukuran Cache (Di-auto-size dari RAM)
  msg-cache-size: {{MSG_CACHE}}
  rrset-cache-size: {{RRSET_CACHE}}
  key-cache-size: {{KEY_CACHE}}
  neg-cache-size: {{NEG_CACHE}}

  # === 5. Monitoring & Statistik ===
  statistics-interval: 0
  extended-statistics: yes

  # === 6. Rekursi & DNSSEC (Jika Mode=Recursive) ===
{{RECURSIVE_CONFIG}}

  # === 7. Filtering & Blocklist ===
  include: "/etc/unbound/blocklist/ad-malware-block.conf"
  #include: "/etc/unbound/blocklist/adult-redirect.conf"
  include: "/etc/unbound/blocklist/whitelist.conf"

  # === 8. DNSSEC Bypass (Domain CDN yang sering masalah) ===
  include: "/etc/unbound/unbound.conf.d/*.conf"

  # === 9. SafeSearch Redirect (Google & Bing) ===
{{SAFESEARCH_CONFIG}}

  # === 10. Local Static Records ===
  include: "/etc/unbound/conf/local-records.conf"

remote-control:
  control-enable: yes
  control-port: 8953
  control-use-cert: no
  control-interface: 127.0.0.1

# === 11. Forwarder (Jika Mode=DoH) ===
{{FORWARD_CONFIG}}
