services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: netora
      POSTGRES_USER: netora
      POSTGRES_PASSWORD: change-me-in-dev-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  unbound:
    image: mvance/unbound:latest
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./unbound:/opt/unbound/etc/unbound
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

volumes:
  postgres_data:
