global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "netora-dns"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["172.18.20.145:8080"]
        labels:
          node: "dns-dev"
          role: "primary-resolver"
          region: "datacenter-1"
